; WearTest ATE cycle-time study settings.
; These values are portfolio-project assumptions for a simulated wearable test
; station. They are not WHOOP manufacturing cycle times or factory requirements.
;
; WearTest validates faster sequences against the same simulated device faults and
; the same manufacturing test engine used elsewhere in the project. A candidate is
; only considered validated when it meets all three quality guardrails below.

[study]
default_product = Wearable + ECG
validation_devices = 168
rng_seed = 20260924
min_detection_retention_percent = 99.0
max_escape_rate_percent = 1.0
max_false_reject_increase_pp = 1.0

[fixed_time]
communication_s = 1.20
battery_s = 0.80
temperature_s = 1.00
ecg_s = 1.50
record_and_save_s = 0.80

[baseline]
name = Baseline sequential
imu_window_s = 5.00
ppg_window_s = 8.00
parallel_motion = false
parallel_optical_temperature = false

[candidate:Parallel acquisition]
imu_window_s = 5.00
ppg_window_s = 8.00
parallel_motion = true
parallel_optical_temperature = true

[candidate:Balanced]
imu_window_s = 3.00
ppg_window_s = 5.00
parallel_motion = true
parallel_optical_temperature = true

[candidate:Aggressive]
imu_window_s = 1.50
ppg_window_s = 1.50
parallel_motion = true
parallel_optical_temperature = true

[candidate:Too short]
imu_window_s = 1.00
ppg_window_s = 0.80
parallel_motion = true
parallel_optical_temperature = true
