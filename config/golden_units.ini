; WearTest ATE golden-unit references and simulated station behavior.
; These values are portfolio-project assumptions only. They are not WHOOP
; production specifications, calibration limits, or factory procedures.
;
; Reference values describe a known-good wearable used to verify the tester.
; Tolerances are allowed tester-to-reference bias, not product acceptance limits.

[golden_unit]
device_id = GOLDEN-001
include_ecg = true
ppg_fixture_frequency_hz = 1.20

[reference]
battery_voltage_v = 4.050
accel_x_g = 0.000
accel_y_g = 0.000
accel_z_g = 1.000
gyro_x_dps = 0.080
gyro_y_dps = -0.060
gyro_z_dps = 0.100
ppg_amplitude = 0.220
skin_temperature_c = 33.000
ecg_impedance_kohm = 90.000

[bias_limits]
battery_voltage_v = 0.050
accel_axis_g = 0.025
gyro_axis_dps = 0.200
ppg_amplitude = 0.035
skin_temperature_c = 0.300
ecg_impedance_kohm = 15.000

[health]
; A metric becomes a warning once its absolute bias reaches this fraction of
; its action limit. It becomes Needs attention when the full limit is exceeded.
warning_fraction = 0.70

; Station drift is intentionally simulated so tester-health behavior can be
; demonstrated without physical ATE hardware. The per-check term is multiplied
; by (golden check number - 1), which creates gradual drift over repeated checks.

