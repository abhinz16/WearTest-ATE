; WearTest ATE crossed Gage R&R study settings.
; These values are portfolio-project assumptions for a simulated measurement
; system. They are not WHOOP manufacturing requirements or factory limits.
;
; The default decision bands below are intentionally editable. WearTest uses
; them only to label this simulated study; the numeric %GRR result is always
; shown so an engineer can apply a different internal standard if needed.

[study]
default_metric = accel_x
reference_units = 5
trials_per_station = 3
warning_percent_grr = 10.0
action_percent_grr = 30.0
ndc_min = 5

[metric:battery_voltage]
display_name = Battery voltage
unit = V
nominal = 4.05
part_span = 0.20
repeatability_sigma = 0.006

[metric:accel_x]
display_name = Accelerometer X
unit = g
nominal = 0.000
part_span = 0.080
repeatability_sigma = 0.0030

[metric:accel_y]
display_name = Accelerometer Y
unit = g
nominal = 0.000
part_span = 0.080
repeatability_sigma = 0.0030

[metric:accel_z]
display_name = Accelerometer Z
unit = g
nominal = 1.000
part_span = 0.080
repeatability_sigma = 0.0030

[metric:gyro_x]
display_name = Gyroscope X
unit = deg/s
nominal = 0.080
part_span = 0.60
repeatability_sigma = 0.035

[metric:gyro_y]
display_name = Gyroscope Y
unit = deg/s
nominal = -0.060
part_span = 0.60
repeatability_sigma = 0.035

[metric:gyro_z]
display_name = Gyroscope Z
unit = deg/s
nominal = 0.100
part_span = 0.60
repeatability_sigma = 0.035

[metric:ppg_amplitude]
display_name = Optical response amplitude
unit = normalized
nominal = 0.220
part_span = 0.100
repeatability_sigma = 0.006

[metric:skin_temperature]
display_name = Skin temperature
unit = degC
nominal = 33.000
part_span = 1.50
repeatability_sigma = 0.050

[metric:ecg_electrode_impedance]
display_name = ECG electrode impedance
unit = kohm
nominal = 90.0
part_span = 40.0
repeatability_sigma = 1.5
