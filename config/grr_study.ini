; WearTest ATE crossed Gage R&R study settings.
; These values are project assumptions for a simulated measurement system.
; The decision bands are editable; the numeric %GRR result is always shown.

[study]
default_metric = accel_x
reference_units = 5
trials_per_station = 3
warning_percent_grr = 10.0
action_percent_grr = 30.0
ndc_min = 5

[metric:battery_voltage]
display_name = Battery voltage
unit = V
nominal = 4.05
part_span = 0.20
repeatability_sigma = 0.006

[metric:charging_current]
display_name = Charging current
unit = mA
nominal = 260.0
part_span = 60.0
repeatability_sigma = 2.0

[metric:idle_current]
display_name = Idle current
unit = mA
nominal = 2.20
part_span = 2.00
repeatability_sigma = 0.05

[metric:active_current]
display_name = Active current
unit = mA
nominal = 45.0
part_span = 20.0
repeatability_sigma = 1.0

[metric:accel_x]
display_name = Accelerometer X
unit = g
nominal = 0.000
part_span = 0.080
repeatability_sigma = 0.0030

[metric:accel_y]
display_name = Accelerometer Y
unit = g
nominal = 0.000
part_span = 0.080
repeatability_sigma = 0.0030

[metric:accel_z]
display_name = Accelerometer Z
unit = g
nominal = 1.000
part_span = 0.080
repeatability_sigma = 0.0030

[metric:gyro_x]
display_name = Gyroscope X
unit = °/s
nominal = 0.080
part_span = 0.60
repeatability_sigma = 0.035

[metric:gyro_y]
display_name = Gyroscope Y
unit = °/s
nominal = -0.060
part_span = 0.60
repeatability_sigma = 0.035

[metric:gyro_z]
display_name = Gyroscope Z
unit = °/s
nominal = 0.100
part_span = 0.60
repeatability_sigma = 0.035

[metric:ppg_amplitude]
display_name = PPG optical amplitude
unit = normalized
nominal = 0.220
part_span = 0.100
repeatability_sigma = 0.006

[metric:spo2_red_amplitude]
display_name = SpO₂ red optical amplitude
unit = normalized
nominal = 0.180
part_span = 0.080
repeatability_sigma = 0.005

[metric:spo2_ir_amplitude]
display_name = SpO₂ infrared optical amplitude
unit = normalized
nominal = 0.210
part_span = 0.080
repeatability_sigma = 0.005

[metric:skin_temperature]
display_name = Skin temperature
unit = °C
nominal = 33.000
part_span = 1.50
repeatability_sigma = 0.050

[metric:ble_tx_power]
display_name = BLE transmit power
unit = dBm
nominal = -1.0
part_span = 4.0
repeatability_sigma = 0.15

[metric:ble_packet_error_rate]
display_name = BLE packet error rate
unit = %
nominal = 0.20
part_span = 0.60
repeatability_sigma = 0.03

[metric:ble_frequency_error]
display_name = BLE frequency error
unit = kHz
nominal = 8.0
part_span = 30.0
repeatability_sigma = 1.0

[metric:haptic_rms]
display_name = Haptic vibration RMS
unit = g
nominal = 0.283
part_span = 0.120
repeatability_sigma = 0.005

[metric:haptic_frequency]
display_name = Haptic vibration frequency
unit = Hz
nominal = 175.0
part_span = 20.0
repeatability_sigma = 0.7

[metric:ecg_electrode_impedance]
display_name = ECG electrode impedance
unit = kΩ
nominal = 90.0
part_span = 40.0
repeatability_sigma = 1.5

[metric:ecg_waveform_amplitude]
display_name = ECG waveform amplitude
unit = mV
nominal = 1.000
part_span = 0.400
repeatability_sigma = 0.020
