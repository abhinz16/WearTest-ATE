; WearTest ATE product profiles.
; Add another [product:...] section to make a new profile available in the GUI.
; Batch suffix is appended to the Device ID only when "Run all product profiles"
; is used, so each simulated product receives a unique traceability identifier.

[product:Wearable]
include_spo2 = true
include_power_current = true
include_ble_rf = true
include_haptic = true
include_ecg = false
include_ecg_waveform = false
batch_suffix = WEARABLE

[product:Wearable + ECG]
include_spo2 = true
include_power_current = true
include_ble_rf = true
include_haptic = true
include_ecg = true
include_ecg_waveform = true
batch_suffix = ECG
