; WearTest ATE product profiles.
; Add another [product:...] section to make a new profile available in the GUI.
; The batch suffix is appended to the Device ID only when "Run all product profiles"
; is used, so each simulated product receives a unique traceability identifier.

[product:Wearable]
include_ecg = false
batch_suffix = WEARABLE

[product:Wearable + ECG]
include_ecg = true
batch_suffix = ECG
