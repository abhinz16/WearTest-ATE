; WearTest ATE simulated engineering limits.
; These values are project assumptions for exercising the software and are not
; production specifications from any wearable manufacturer.

[power]
battery_voltage_min_v = 3.85
battery_voltage_max_v = 4.25
charging_current_min_ma = 180.0
charging_current_max_ma = 360.0
idle_current_max_ma = 5.0
active_current_max_ma = 80.0

[accelerometer]
axis_bias_max_g = 0.035
noise_rms_max_g = 0.015

[gyroscope]
bias_max_dps = 0.50
noise_rms_max_dps = 0.20

[optical_ppg]
snr_min_db = 18.0
fixture_frequency_hz = 1.20
saturation_max_fraction = 0.02

[spo2_optical]
fixture_frequency_hz = 1.20
red_snr_min_db = 18.0
ir_snr_min_db = 18.0
ratio_reference = 0.86
ratio_tolerance = 0.10
saturation_max_fraction = 0.02

[temperature]
reference_c = 33.0
error_max_c = 0.50

[ble_rf]
tx_power_min_dbm = -6.0
tx_power_max_dbm = 4.0
packet_error_rate_max_percent = 1.0
frequency_error_max_khz = 50.0

[haptic]
frequency_reference_hz = 175.0
frequency_tolerance_hz = 15.0
rms_min_g = 0.15
rms_max_g = 0.60

[ecg]
electrode_impedance_max_kohm = 150.0

[ecg_waveform]
fixture_rate_hz = 1.00
amplitude_min_mv = 0.70
amplitude_max_mv = 1.30
correlation_min = 0.90
noise_rms_max_mv = 0.10
