; WearTest ATE simulated engineering limits.
; These values are for the portfolio project only. They are not WHOOP production specifications.
; A manufacturing engineer can change limits here without editing Python code.

[power]
battery_voltage_min_v = 3.85
battery_voltage_max_v = 4.25

[accelerometer]
axis_bias_max_g = 0.035
noise_rms_max_g = 0.015

[gyroscope]
bias_max_dps = 0.50
noise_rms_max_dps = 0.20

[optical_ppg]
snr_min_db = 18.0
fixture_frequency_hz = 1.20
saturation_max_fraction = 0.02

[temperature]
reference_c = 33.0
error_max_c = 0.50

[ecg]
electrode_impedance_max_kohm = 150.0
